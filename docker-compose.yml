name: quest-compose

services:
  mysql:
    image: mysql:8.0.45
    container_name: quest-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 3s
      retries: 10
      interval: 5s

    volumes:
      - db_data:/var/lib/mysql
      - ./quest-init.sql:/docker-entrypoint-initdb.d/setup.sql

    networks:
      - quest-net

  boot:
    build:
      context: quest-boot
    container_name: quest-boot

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql/quest
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - quest-net

  angular:
    build:
      context: quest-angular
    container_name: quest-angular

    ports:
      - 80:80

    depends_on:
      - boot

    networks:
      - quest

volumes:
  db_data:
    name: quest-db-data

networks:
  quest-net:
    name: quest
